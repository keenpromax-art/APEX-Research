services:
  - type: web
    name: apex-terminal-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./apex.db
      - key: CORS_ORIGINS
        value: https://apex-research-ten.vercel.app,http://localhost:3000
      - key: SECRET_KEY
        generateValue: true
